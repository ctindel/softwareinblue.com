version: 2
frontend:
  phases:
    # See this issue about needing to over ride the hugo version for extended support
    # https://github.com/aws-amplify/amplify-hosting/issues/884
    preBuild:
      commands:
        - wget https://github.com/gohugoio/hugo/releases/download/v0.161.1/hugo_extended_0.161.1_linux-amd64.tar.gz
        - tar -xf hugo_extended_0.161.1_linux-amd64.tar.gz hugo
        - mv hugo /usr/bin/hugo
        - rm -rf hugo_extended_0.161.1_linux-amd64.tar.gz
        - which hugo
        - hugo version
        - /usr/bin/hugo version
    build:
      commands:
        #- git submodule update --init --recursive --depth 1
        # Pinned to ctindel fork branch with Hugo 0.144/0.158 deprecation fixes.
        # Once upstream PR https://github.com/mattstratton/castanet/pull/519
        # is merged, revert this to:
        #   - git clone https://github.com/mattstratton/castanet themes/castanet
        - git clone -b fix/hugo-0.158-deprecations https://github.com/ctindel/castanet themes/castanet
        - /usr/bin/hugo
        - yum install -y libxslt
        - curl -o /tmp/anchor_rss.xml 'https://anchor.fm/s/554c0a2c/podcast/rss'
        - xsltproc anchor-podtrac-rss-transform.xsl /tmp/anchor_rss.xml > public/anchor_podtrac_rss.xml
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths: []
