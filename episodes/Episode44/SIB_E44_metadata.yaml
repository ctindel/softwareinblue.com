  long_description: 'Ian Spandow is friends with Bono and U2, a standup comic, a musician,
    an author, and a dog rescuer. Does it take all of that to be a successful sales
    trainer?


    Ian Spandow has built his career as a sales trainer and sales coach at some of
    the biggest technology companies in the world like Oracle and MongoDB. His ability
    to engage the trainees is not merely natural rapport — he goes into detail into
    a bunch of different techniques that he uses to keep people focused and enjoying
    the learning process.


    Ian also runs a Dog Sanctuary in Grass Valley for dogs that aren''t suitable for
    the typical shelter environment. His new book "Rescuing Dogs and Salespeople:
    Memoir of a Mutt" is available on Amazon and proceeds from the book help fund
    the Dog Sanctuary.


    Please donate to Ian''s Dog Rescue shelter online at https://spandowhouse.com/

