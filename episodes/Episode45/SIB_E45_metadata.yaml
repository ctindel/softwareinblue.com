  long_description: 'How is AI being used by kids in schools today and what is the
    right way to harness and teach AI skills to our children?


    Dr. Roberta Lenger Kang is a world-renowned expert in modern techniques for teacher
    training and development. Her work at the Center for the Professional Education
    of Teachers at Columbia University takes her around the world where she and her
    team are brought in to overhaul teacher training programs in ways that align with
    the local curriculum, needs of students, and social customs and norms that can
    affect the incentive structures for how students and teachers learn.


    Dr. Kang holds an Ed.D. from Teachers College at Columbia University, where her
    research work and dissertation ("Assessment Matters: Negotiating the New York
    State English Regents Exam") focused on the history and pitfalls of high-stakes
    testing in the NY Department of Education.


    Dr. Kang joins us today to discuss the use of AI in education, where it can go
    wrong and how it can be used to help students learn better. Her organization consulted
    on the development of ConnectInk, an AI application that helps students become
    better writers.

    '
